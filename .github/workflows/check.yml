name: Companion checks
on:
  pull_request:
  push:
    branches: [main, staging]
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Compile and test native models
        run: |
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("iPhone")))')
          xcodebuild -project ios/Herdr.xcodeproj -scheme Herdr -destination "platform=iOS Simulator,id=$simulator_id" -only-testing:HerdrTests CODE_SIGNING_ALLOWED=NO test
