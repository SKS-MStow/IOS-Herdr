name: Herdr
options:
  bundleIdPrefix: xyz.verdalecres
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: V8W579ZBVB
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 4
targets:
  Herdr:
    type: application
    platform: iOS
    sources: [Herdr]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.verdalecres.herdr
        INFOPLIST_FILE: Herdr/Info.plist
        CODE_SIGN_ENTITLEMENTS: Herdr/Herdr.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: [HerdrTests, HerdrUITests]
  HerdrTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HerdrTests]
    dependencies:
      - target: Herdr
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  HerdrUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [HerdrUITests]
    dependencies:
      - target: Herdr
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
